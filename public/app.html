<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">AP</div>
        <span>Attendance Pro</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item" data-view="dashboard">
          <span class="nav-icon">📊</span>Dashboard
        </button>
        <button class="nav-item" data-view="students">
          <span class="nav-icon">🧑‍🎓</span>Students
        </button>
        <button class="nav-item" data-view="courses">
          <span class="nav-icon">📚</span>Courses
        </button>
        <button class="nav-item" data-view="attendance">
          <span class="nav-icon">✅</span>Attendance
        </button>
        <button class="nav-item" data-view="reports">
          <span class="nav-icon">📈</span>Reports
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">A</div>
          <div>
            <div class="uname" id="user-name">Loading…</div>
            <div class="urole" id="user-role">—</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-block" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="sidebar-toggle" title="Toggle menu">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <div class="topbar-actions">
          <span class="today-label" id="today-label"></span>
          <button class="icon-btn" id="refresh-btn" title="Refresh">↻</button>
        </div>
      </header>
      <section class="view" id="view"></section>
    </div>
  </div>

  <div id="toast-container"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/students.js"></script>
  <script src="/js/views/courses.js"></script>
  <script src="/js/views/attendance.js"></script>
  <script src="/js/views/reports.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
